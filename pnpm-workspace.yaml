packages:
  - "apps/*"
  - "packages/*"

# pnpm 12 blocks dependency build scripts unless listed here.
# esbuild must build to install its platform binary. The rest are optional
# native addons pulled in by testcontainers and work without building.
allowBuilds:
  esbuild: true
  argon2: true
  cpu-features: false
  protobufjs: false
  ssh2: false

minimumReleaseAgeExclude:
  - vite@8.3.1
  # Claude Agent SDK ships platform binaries published the same day as the
  # main package; the release-age policy would otherwise block fresh installs.
  - "@anthropic-ai/claude-agent-sdk"
  - "@anthropic-ai/claude-agent-sdk-*"
