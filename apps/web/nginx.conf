# Serves apps/web/dist and proxies API calls to the api service
# (design.md §15.1). SSE streaming endpoints (/api/*/stream) disable
# buffering so events reach the client as they are written.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolves service names; resolve api per request
    # (instead of at config load) so nginx starts/reloads even when the api
    # container is not running yet (design.md build order step 3 / GOT.18).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE streams: no buffering/caching, long read timeout, no keep-alive
    # header rewriting, HTTP/1.1 required for chunked responses. Matches
    # both /api/stream and /api/<segments>/stream (design.md §12.6).
    location ~ ^/api/(.*/)?stream$ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
